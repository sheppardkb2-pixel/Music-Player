<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Music Player</h1>

  <!-- Music Player Container -->
  <div class="music-container" id="music-container">
    <div class="music-info">
      <h4 id="title">Khamari - These Four Walls (Lyrics)</h4>
      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>

        <!-- Progress Bar -->
      </div>
      <div class="time-display">
        <span id="current-time">00:00</span>
        <span class="divider">/</span>
        <span id="duration">00:00</span>
      </div>
    </div>

<!-- Audio Elements -->
    <audio id="audio" src="music/Khamari - These Four Walls (Lyrics).mp3"></audio>

    <div class="img-container">
      <img src="Images/Khamari - These Four Walls (Lyrics).jpg" alt="Album Cover" id="cover" />
    </div>

    <!-- Navigation Buttons -->
    <div class="navigation">
      <button id="prev" class="action-btn"><i class="fas fa-backward"></i></button>
      <button id="play" class="action-btn action-btn-big"><i class="fas fa-play"></i></button>
      <button id="next" class="action-btn"><i class="fas fa-forward"></i></button>
    </div>
  </div>
</body>
</html>
